[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "figi-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented financial instrument identifier claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
figi-validation-claim-audit = "figi_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["figi_validation_claim_audit*"]
